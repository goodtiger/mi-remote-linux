name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release tooling
        run: python -m pip install -e ".[dev,release]"
      - name: Verify tag matches package version
        run: python scripts/check_release.py "${GITHUB_REF_NAME}"
      - name: Lint and test
        run: |
          ruff format --check .
          ruff check .
          pytest -q
      - name: Build and validate distributions
        run: |
          python -m build
          twine check dist/*
          cp scripts/install_release.py dist/install-mi-remote.py
          (cd dist && sha256sum *.whl *.tar.gz install-mi-remote.py > SHA256SUMS)
      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/mi-remote-release-smoke
          /tmp/mi-remote-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/mi-remote-release-smoke/bin/mi-remote --help
          /tmp/mi-remote-release-smoke/bin/python -c \
            "import importlib.metadata as m; assert m.version('mi-remote-linux') == '${GITHUB_REF_NAME#v}'"
      - uses: actions/upload-artifact@v4
        with:
          name: mi-remote-linux-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "MiRemote Linux ${GITHUB_REF_NAME}"
